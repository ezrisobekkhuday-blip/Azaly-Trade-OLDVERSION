<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta
    name="description"
    content="Azaly Trade PWA for shops, storefront photos, purchases, dashboard, and expenses."
  >
  <meta name="theme-color" content="#061126">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Azaly Trade">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Azaly Trade</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at top left, rgba(95, 224, 184, 0.18), transparent 38%),
        radial-gradient(circle at top right, rgba(124, 146, 255, 0.16), transparent 34%),
        #061126;
    }

    body {
      overflow: hidden;
      font-family: "Segoe UI", sans-serif;
      color: #f5f7ff;
    }

    .boot-shell {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    .boot-card {
      width: min(420px, calc(100vw - 32px));
      padding: 28px;
      border-radius: 28px;
      border: 1px solid rgba(135, 157, 210, 0.18);
      background: linear-gradient(180deg, rgba(12, 24, 56, 0.94), rgba(8, 17, 39, 0.96));
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      box-sizing: border-box;
    }

    .boot-badge {
      display: inline-flex;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(95, 224, 184, 0.14);
      color: #65f0d2;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .boot-title {
      margin: 18px 0 10px;
      font-size: 36px;
      font-weight: 800;
      line-height: 1.05;
    }

    .boot-subtitle {
      margin: 0 0 22px;
      color: rgba(235, 240, 255, 0.76);
      font-size: 15px;
      line-height: 1.45;
    }

    .boot-progress {
      position: relative;
      width: 100%;
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
    }

    .boot-progress::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 42%;
      border-radius: inherit;
      background: linear-gradient(90deg, #5fe0b8, #71cfff);
      animation: boot-slide 1.3s ease-in-out infinite;
    }

    @keyframes boot-slide {
      0% { transform: translateX(-100%); }
      55% { transform: translateX(170%); }
      100% { transform: translateX(170%); }
    }
  </style>
</head>
<body>
  <div class="boot-shell" id="boot-shell">
    <div class="boot-card">
      <div class="boot-badge">Azaly Trade</div>
      <h1 class="boot-title">PWA</h1>
      <p class="boot-subtitle">Loading shops, purchases, favorites, dashboard, and expenses.</p>
      <div class="boot-progress"></div>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="zxing_library.js" defer></script>
  <script src="wechat_qr_decoder.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      const shell = document.getElementById("boot-shell");
      if (shell) {
        shell.remove();
      }
    });
  </script>
</body>
</html>
